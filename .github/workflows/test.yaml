---
name: Unit tests

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "0 0 * * *"

jobs:
  test:
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        python-version: ["3.14"]
    name: Run tests (Python ${{ matrix.python-version }})
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        if: github.event_name != 'schedule'
        run: uv sync --locked

      # Scheduled runs deliberately resolve fresh, so new Home Assistant
      # releases are exercised rather than pinned by uv.lock.
      - name: Install dependencies (latest)
        if: github.event_name == 'schedule'
        run: uv sync --upgrade

      - name: Run tests
        run: |
          uv run pytest \
            -qq \
            --timeout=9 \
            --durations=10 \
            -n auto \
            --cov custom_components.givenergy_local \
            -o console_output_style=count \
            -p no:sugar \
            tests
